<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F3627">
<title>اختبار اللغة الإنجليزية — Graines de Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;600&family=Noto+Naskh+Arabic:wght@700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<style>
:root {
  --green:#0F3627;
  --green-hover:#1A4D39;
  --leaf:#2A6E4E;
  --ground:#F2F5F0;
  --field:#F8FAF6;
  --tint:#E3EDE5;
  --ink:#16261E;
  --muted:#4C5E54;
  --line:#CBD6CD;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--ground); font-family:'Noto Sans Arabic','Inter','Segoe UI',Tahoma,Arial,sans-serif; color:var(--ink); min-height:100vh; }

.site-header { background:var(--green); color:#FFFFFF; padding:26px 20px; }
.site-header-inner { max-width:700px; margin:0 auto; }
.site-name { font-family:'Fraunces',Georgia,serif; font-size:28px; font-weight:700; line-height:1.2; }
.site-slogan { margin-top:4px; font-size:15px; color:#CFE0D4; }
.hero-logo { display:block; width:240px; max-width:70%; height:auto; margin:0 auto 24px; mix-blend-mode:multiply; }

main { padding:32px 20px 72px; }
.page-title { max-width:700px; margin:0 auto 20px; font-family:'Noto Naskh Arabic','Noto Sans Arabic',Tahoma,serif; font-size:28px; font-weight:700; line-height:1.5; color:var(--green); }
.card { max-width:700px; margin:0 auto 22px; border:1px solid var(--line); background:#FFFFFF; border-radius:12px; padding:30px 34px; }
.intro-box { max-width:700px; margin:0 auto 22px; font-size:16px; line-height:1.9; color:var(--muted); }
.intro-box b { color:var(--ink); }
label.field-label { display:block; font-size:14px; color:var(--leaf); font-weight:700; margin-bottom:8px; }
input.field-input { width:100%; background:var(--field); border:1px solid var(--line); border-radius:8px; padding:12px 14px; color:var(--ink); font:inherit; font-size:16px; margin-bottom:20px; }
input.field-input:focus { outline:2px solid var(--leaf); outline-offset:1px; border-color:var(--leaf); }
input[type=email] { direction:ltr; text-align:right; }
.section-kicker { color:var(--leaf); font-size:13px; font-weight:700; margin-bottom:12px; line-height:1.6; }
.q-text { font-family:'Inter','Segoe UI',Arial,sans-serif; font-size:18px; font-weight:600; line-height:1.4; text-align:left; }
.q-help { margin:14px 0 16px; font-size:14px; font-weight:600; color:var(--leaf); }
.options { display:flex; flex-direction:column; gap:10px; }
.opt { display:block; width:100%; min-height:46px; text-align:left; border:1px solid var(--line); background:var(--field); border-radius:8px; padding:12px 18px; cursor:pointer; font-family:'Inter','Segoe UI',Arial,sans-serif; font-size:15px; color:var(--ink); transition:background 0.15s, border-color 0.15s; }
.opt:hover { background:var(--tint); }
.opt:focus-visible, .btn:focus-visible, .cta-btn:focus-visible { outline:2px solid var(--leaf); outline-offset:2px; }
.opt.selected { border:2px solid var(--green); padding:11px 17px; background:var(--tint); font-weight:600; }
.progress-bar-wrap { max-width:700px; margin:0 auto 22px; }
.progress-label { display:flex; justify-content:space-between; font-size:14px; color:var(--muted); margin-bottom:8px; }
.progress-bar-bg { height:6px; background:#D9E2DA; border-radius:4px; overflow:hidden; }
.progress-bar { height:100%; background:var(--leaf); width:0%; transition:width 0.3s; }
.btn-row { max-width:700px; margin:0 auto; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:12px; }
.btn { min-height:46px; border:2px solid var(--green); background:transparent; color:var(--green); font:inherit; font-size:15px; font-weight:700; padding:9px 24px; border-radius:8px; cursor:pointer; transition:background 0.15s; }
.btn:hover:not(:disabled) { background:var(--tint); }
.btn.primary { background:var(--green); color:#FFFFFF; }
.btn.primary:hover:not(:disabled) { background:var(--green-hover); }
.btn:disabled { opacity:0.4; cursor:not-allowed; }
.hidden { display:none !important; }
.consent-row { display:flex; align-items:flex-start; gap:10px; margin-top:4px; font-size:14px; color:var(--muted); line-height:1.7; }
.consent-row input { margin-top:5px; flex-shrink:0; width:16px; height:16px; accent-color:var(--green); }

.result-card { text-align:center; padding:40px 34px; }
.result-subtitle { color:var(--leaf); font-size:15px; font-weight:700; margin-bottom:6px; }
.result-title { font-family:'Noto Naskh Arabic','Noto Sans Arabic',Tahoma,serif; font-size:30px; font-weight:700; color:var(--green); line-height:1.5; margin-bottom:22px; }
.score-display { display:flex; justify-content:center; gap:34px; margin-bottom:24px; }
.score-num { font-size:42px; font-weight:700; color:var(--green); line-height:1.2; }
.score-label { margin-top:2px; font-size:13px; color:var(--muted); }
.result-desc { color:var(--muted); font-size:16px; line-height:1.9; max-width:520px; margin:0 auto 28px; }
.cta-btn { display:block; max-width:340px; margin:0 auto; background:var(--green); color:#FFFFFF; font-size:15px; font-weight:700; text-align:center; padding:14px 24px; border-radius:8px; text-decoration:none; transition:background 0.15s; }
.cta-btn:hover { background:var(--green-hover); }

@media (max-width:560px) {
  .site-header { padding:20px 16px; }
  .site-name { font-size:23px; }
  main { padding:26px 16px 56px; }
  .page-title { font-size:25px; }
  .card { padding:24px 20px; }
  .result-card { padding:32px 20px; }
  .btn-row .btn { flex:1 1 auto; }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  document.getElementById('btn-next').textContent = current === QUESTIONS.length-1 ? "عرض نتيجتي ✓" : "التالي ←";
}

function selectOption(i){
  answers[current] = i;
  renderQuestion();
  document.querySelector('.opt.selected').focus();
}

function prevQuestion(){
  if(current > 0){ current--; renderQuestion(); }
}

function nextQuestion(){
  if(answers[current] === null) return;
  if(current < QUESTIONS.length-1){
    current++;
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult(){
  document.getElementById('step-quiz').classList.add('hidden');
  document.getElementById('step-result').classList.remove('hidden');

  const tally = key => {
    const out = {};
    QUESTIONS.forEach((q,i)=>{
      out[q[key]] = out[q[key]] || { ok:0, total:0 };
      out[q[key]].total++;
      if(answers[i]===q.correct) out[q[key]].ok++;
    });
    return out;
  };
  const byLevel = tally('level'), byCat = tally('cat');
  const score = QUESTIONS.reduce((s,q,i)=>s+(answers[i]===q.correct?1:0), 0);

  // Le niveau retenu est le plus haut niveau validé
  let reached = "A1", okSoFar = 0, totalSoFar = 0;
  Object.keys(LEVELS).forEach(l=>{
    okSoFar += byLevel[l].ok; totalSoFar += byLevel[l].total;
    if(byLevel[l].ok/byLevel[l].total >= PASS && okSoFar/totalSoFar >= PASS) reached = l;
  });
  const { title, fr:titleFr, desc } = LEVELS[reached];

  document.getElementById('score-num').textContent = score;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-desc').textContent = desc;

  // Envoi du résultat via EmailJS (uniquement une fois EMAILJS_CONFIG rempli)
  if(window.emailjs && EMAILJS_CONFIG.publicKey && EMAILJS_CONFIG.serviceId && EMAILJS_CONFIG.templateId){
    emailjs.init(EMAILJS_CONFIG.publicKey);
    emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, {
      name: prenom,
      email: email,
      message: "Score : " + score + "/" + QUESTIONS.length
        + "\nNiveau : " + titleFr
        + "\n\nDétail par catégorie :\n"
        + Object.keys(CATEGORIES).map(c=>"- " + CATEGORIES[c].fr + " : " + byCat[c].ok + "/" + byCat[c].total).join("\n")
        + "\n\nDétail par niveau :\n"
        + Object.keys(LEVELS).map(l=>"- " + l + " : " + byLevel[l].ok + "/" + byLevel[l].total).join("\n"),
      time: new Date().toLocaleString('fr-FR')
    }).catch(()=>{});
  }
}
</script>
</body></html>
